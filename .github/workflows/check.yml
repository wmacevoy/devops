name: check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false   # when it breaks, the interesting question is which platforms broke (SE1/O3)
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]   # the oldest the tools support, and the newest
        include:
          # setup-python has no 3.9 for Ubuntu 26.04, which ubuntu-latest became in 2026-11
          - os: ubuntu-latest
            python: "3.9"
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner || matrix.os }}
    steps:
      # Full history: the checker reads this guide's own tags once there are any (a copy's label,
      # a patch release's minor).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The same commands a contributor runs locally (SE1/O3); no dependencies to install.
      - run: python3 -I tools/check.py
      - run: python3 -I tools/test_check.py
